name: akadex
description: "Plateforme academique et communautaire pour etudiants"
publish_to: 'none'
version: 1.1.4+6

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  go_router: ^15.1.2
  dio: ^5.8.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  equatable: ^2.0.7
  uuid: ^4.5.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  video_player: ^2.9.5
  chewie: ^1.11.3
  url_launcher: ^6.3.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  path: ^1.9.1
  connectivity_plus: ^6.1.4
  image_picker: ^1.1.2
  record: ^6.2.1
  just_audio: ^0.10.6
  permission_handler: ^12.0.3
  pdfx: ^2.9.2
  file_picker: 8.3.7
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#1A47B8"
  adaptive_icon_foreground: assets/images/logo.png
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/logo.png
    background_color: "#1A47B8"
    theme_color: "#1A47B8"
  windows:
    generate: true
    image_path: assets/images/logo.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-thin.ttf
          weight: 100
        - asset: assets/fonts/roboto-light.ttf
          weight: 300
        - asset: assets/fonts/roboto-regular.ttf
          weight: 400
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
        - asset: assets/fonts/roboto-black.ttf
          weight: 900
        - asset: assets/fonts/roboto-thinitalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/roboto-lightitalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/roboto-italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/roboto-mediumitalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/roboto-bolditalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/roboto-blackitalic.ttf
          weight: 900
          style: italic


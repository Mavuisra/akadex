# Blueprint Render — Akadex API (SQLite par défaut, simple pour démo)
# Docs: https://render.com/docs/blueprint-spec
#
# Note: sur le plan free, le disque est éphémère.
# start.sh refait migrate + seed_demo à chaque démarrage.

services:
  - type: web
    name: akadex
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: chmod +x build.sh start.sh && ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /api/universities/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      # Supabase Storage — renseigner les valeurs dans le dashboard Render
      - key: USE_S3_MEDIA
        value: "True"
      - key: SUPABASE_BUCKET_PUBLIC
        value: "False"
      - key: SUPABASE_PROJECT_REF
        value: "eyjhscpbdimuqetkwway"
      - key: AWS_STORAGE_BUCKET_NAME
        value: "akadex-media"
      - key: AWS_S3_ENDPOINT_URL
        value: "https://eyjhscpbdimuqetkwway.storage.supabase.co/storage/v1/s3"
      - key: AWS_S3_REGION_NAME
        value: "eu-west-1"
      - key: AWS_QUERYSTRING_EXPIRE
        value: "3600"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

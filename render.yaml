# Blueprint Render — Akadex API (SQLite par défaut, simple pour démo)
# Docs: https://render.com/docs/blueprint-spec
#
# Note: sur le plan free, le disque est éphémère.
# start.sh refait migrate + seed_demo à chaque démarrage.

services:
  - type: web
    name: akadex
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: chmod +x build.sh start.sh && ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /api/universities/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"

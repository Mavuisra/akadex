<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Akadex — le campus numérique des étudiants">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Akadex">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Akadex</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Requis par pdfx (aperçu PDF web) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs" type="module"></script>
  <script type="module">
    var { pdfjsLib } = globalThis;
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs";

    var pdfRenderOptions = {
      cMapUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/",
      cMapPacked: true,
    };
  </script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    // CanvasKit servi en local (évite gstatic.com bloqué / QUIC).
    _flutter.loader.load({
      config: {
        canvasKitBaseUrl: "/canvaskit/"
      }
    });
  </script>
</body>
</html>

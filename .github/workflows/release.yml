name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Bump version, build & publish
    runs-on: ubuntu-latest
    # Évite la boucle / les commits purement automatiques
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip release]') &&
       !contains(github.event.head_commit.message, '[skip ci]'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bump pubspec version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          line=$(grep '^version:' pubspec.yaml | head -n1)
          raw=${line#version: }
          raw=$(echo "$raw" | tr -d '[:space:]')
          name=${raw%%+*}
          build=${raw##*+}
          if [[ "$name" == "$raw" ]]; then build=0; fi
          IFS='.' read -r major minor patch <<< "$name"
          patch=$((patch + 1))
          build=$((build + 1))
          new_name="${major}.${minor}.${patch}"
          new_full="${new_name}+${build}"
          tag="v${new_name}"

          sed -i "s/^version: .*/version: ${new_full}/" pubspec.yaml
          echo "version=${new_full}" >> "$GITHUB_OUTPUT"
          echo "name=${new_name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Bumped version → ${new_full} (tag ${tag})"

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          if git diff --cached --quiet; then
            echo "No version change to commit"
            exit 0
          fi
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip release]"
          git push origin HEAD:main

      - name: Create git tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.bump.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — aborting to avoid overwrite"
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://akadex.onrender.com/api/

      - name: Build Web
        run: flutter build web --release --dart-define=API_BASE_URL=https://akadex.onrender.com/api/

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.bump.outputs.tag }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/akadex-android-${tag}.apk"
          (cd build/web && zip -r "../../dist/akadex-web-${tag}.zip" .)
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: Akadex ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/akadex-android-*.apk
            dist/akadex-web-*.zip
          body: |
            ## Téléchargements Akadex `${{ steps.bump.outputs.tag }}`

            Version app : `${{ steps.bump.outputs.version }}`

            | Fichier | Plateforme |
            |---------|------------|
            | `akadex-android-${{ steps.bump.outputs.tag }}.apk` | Android |
            | `akadex-web-${{ steps.bump.outputs.tag }}.zip` | Web |

            ### Android
            1. Télécharge le `.apk`
            2. Autorise l’installation depuis des sources inconnues si demandé
            3. Installe

            > Publié automatiquement à chaque push sur `main`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

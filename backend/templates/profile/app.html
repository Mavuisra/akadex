{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0056d2" id="meta-theme-color">
  <title>Akadex — Mon profil</title>
  <meta name="description" content="Suivi d’apprentissage Akadex : progression, série, activité.">
  <link rel="icon" href="{% static 'landing/logo.png' %}" type="image/png">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('akadex-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'landing/css/site-chrome.css' %}">
  <link rel="stylesheet" href="{% static 'profile/css/app.css' %}">
</head>
<body class="site-page-shell">
  {% include "partials/site_nav.html" with nav_active="profil" %}

  <div id="app">
    <div class="boot">
      <div class="boot-spinner"></div>
      <p>Chargement du profil…</p>
    </div>
  </div>

  {% include "partials/auth_modal.html" %}

  <script>
    window.AKADEX_PROFILE = {
      apiBase: '/api/',
      logoUrl: "{% static 'landing/logo.png' %}",
      landingUrl: '/',
      learnUrl: '/apprendre/',
      playStoreUrl: "{{ play_store_url|default:'' }}",
    };
  </script>
  <script type="module">
    import { initSiteNav } from "{% static 'landing/js/site-nav.js' %}";
    import { initAuthModal } from "{% static 'landing/js/auth-modal.js' %}";
    initSiteNav();
    initAuthModal({
      onMenuClose: function () {
        if (typeof window.__akadexCloseMenu === "function") window.__akadexCloseMenu();
      },
    });
  </script>
  <script type="module" src="{% static 'profile/js/app.js' %}"></script>
</body>
</html>

{% load static %}
<header class="topbar site-topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">
      <img src="{% static 'landing/logo.png' %}" width="34" height="34" alt="">
      <span>Akadex</span>
    </a>
    <a class="nav-explore" href="/apprendre/">Explorer</a>
    <nav class="nav-main" aria-label="Navigation principale">
      <a href="/apprendre/"{% if nav_active == 'apprendre' %} class="is-active"{% endif %}>Apprendre</a>
      <a href="/profil/"{% if nav_active == 'profil' %} class="is-active"{% endif %} data-nav-profil>Profil</a>
      <a href="/#domaines">Domaines</a>
      <a href="/#faq">FAQ</a>
    </nav>
    <form class="nav-search" id="nav-search" role="search" action="/apprendre/" method="get">
      <span aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3" stroke-linecap="round"/></svg>
      </span>
      <input type="search" name="q" id="nav-q" placeholder="Que veux-tu apprendre ?" aria-label="Que veux-tu apprendre ?" value="{{ nav_q|default:'' }}">
      <button type="submit" aria-label="Rechercher">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3" stroke-linecap="round"/></svg>
      </button>
    </form>
    <button type="button" class="nav-menu-btn" id="nav-menu-btn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav-drawer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="nav-right gap-tight" id="nav-auth-slot">
      <button type="button" class="btn btn-outline btn-nav-sm btn-auth-desktop" data-auth-open="login" data-guest-only>Connexion</button>
      <button type="button" class="btn btn-primary btn-nav-sm btn-icon-label" data-auth-open="signup" data-guest-only>
        <span class="btn-full">Rejoindre</span>
        <span class="btn-short">Cours</span>
      </button>
      <button type="button" class="btn btn-outline btn-nav-sm" id="nav-logout" data-auth-only hidden>Déconnexion</button>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Basculer le thème" title="Thème">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <nav class="nav-drawer glass" id="nav-drawer" aria-label="Menu mobile" data-open="false" hidden>
      <a href="/apprendre/">Explorer</a>
      <a href="/apprendre/">Apprendre</a>
      <a href="/profil/">Profil</a>
      <a href="/#domaines">Domaines</a>
      <a href="/#faq">FAQ</a>
      <div class="nav-drawer-auth">
        <button type="button" class="btn btn-outline btn-nav-sm" data-auth-open="login" data-guest-only>Connexion</button>
        <button type="button" class="btn btn-primary btn-nav-sm" data-auth-open="signup" data-guest-only>Rejoindre</button>
        <button type="button" class="btn btn-outline btn-nav-sm" data-logout data-auth-only hidden>Déconnexion</button>
      </div>
    </nav>
  </div>
</header>

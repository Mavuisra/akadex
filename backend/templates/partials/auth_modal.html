{% load static %}
<div class="auth-overlay" id="auth-overlay" data-open="false" hidden>
  <div class="auth-panel" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <button type="button" class="auth-close" id="auth-close" aria-label="Fermer">×</button>
    <button type="button" class="auth-back" id="auth-back" hidden>← Retour</button>
    <h2 id="auth-title">Connexion</h2>
    <p class="auth-sub" id="auth-sub" hidden></p>
    <div class="auth-steps" id="auth-signup-steps" hidden aria-hidden="true">
      <span data-step="0" class="active"></span>
      <span data-step="1"></span>
    </div>
    <div class="auth-error" id="auth-error" role="alert"></div>

    <form id="auth-form-email" autocomplete="username">
      <div class="auth-field">
        <label for="auth-email">E-mail</label>
        <input type="email" id="auth-email" name="email" required placeholder="nom@email.com" autocomplete="email" inputmode="email" maxlength="254" spellcheck="false">
      </div>
      <button type="submit" class="auth-primary" id="auth-continue">Continuer</button>
    </form>

    <form id="auth-form-password" hidden autocomplete="current-password">
      <div class="auth-field">
        <label for="auth-password">Mot de passe</label>
        <input type="password" id="auth-password" name="password" required minlength="8" maxlength="128" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="auth-primary" id="auth-login-btn">Se connecter</button>
    </form>

    <form id="auth-form-verify" hidden autocomplete="one-time-code">
      <div class="auth-field">
        <label for="auth-verify-code">Code e-mail</label>
        <input type="text" id="auth-verify-code" name="token" required maxlength="64" placeholder="Code reçu" autocomplete="one-time-code" spellcheck="false">
      </div>
      <button type="submit" class="auth-primary" id="auth-verify-btn">Confirmer</button>
    </form>

    <form id="auth-form-signup" hidden autocomplete="on" novalidate>
      <div data-signup-step="0">
        <div class="auth-row">
          <div class="auth-field">
            <label for="su-last">Nom</label>
            <input type="text" id="su-last" name="last_name" required maxlength="150" autocomplete="family-name">
          </div>
          <div class="auth-field">
            <label for="su-postnom">Postnom</label>
            <input type="text" id="su-postnom" name="postnom" required maxlength="150" autocomplete="additional-name">
          </div>
        </div>
        <div class="auth-field">
          <label for="su-first">Prénom</label>
          <input type="text" id="su-first" name="first_name" required maxlength="150" autocomplete="given-name">
        </div>
        <div class="auth-row">
          <div class="auth-field">
            <label for="su-gender">Sexe</label>
            <select id="su-gender" name="gender" required>
              <option value="">Choisir</option>
              <option value="M">Masculin</option>
              <option value="F">Féminin</option>
              <option value="O">Autre</option>
            </select>
          </div>
          <div class="auth-field">
            <label for="su-birth">Naissance</label>
            <input type="date" id="su-birth" name="birth_date" required>
          </div>
        </div>
        <button type="submit" class="auth-primary" id="su-next-0" data-signup-action="next-0">Continuer</button>
      </div>

      <div data-signup-step="1" hidden>
        <div class="auth-field">
          <label for="su-email">E-mail</label>
          <input type="email" id="su-email" name="email" required maxlength="254" autocomplete="email" spellcheck="false">
        </div>
        <div class="auth-field">
          <label for="su-phone">Téléphone</label>
          <input type="tel" id="su-phone" name="phone" required maxlength="32" placeholder="+243…" autocomplete="tel">
        </div>
        <div class="auth-field">
          <label for="su-password">Mot de passe</label>
          <input type="password" id="su-password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
          <div class="auth-strength"><span id="auth-strength-bar"></span></div>
          <div class="auth-strength-label" id="auth-strength-label"></div>
        </div>
        <div class="auth-field">
          <label for="su-password2">Confirmer</label>
          <input type="password" id="su-password2" name="password_confirm" required minlength="8" maxlength="128" autocomplete="new-password">
        </div>
        <label class="auth-check">
          <input type="checkbox" id="su-terms" name="terms" required>
          <span>J’accepte les <a href="/legal/terms/">Conditions</a> et la <a href="/legal/privacy/">Confidentialité</a>.</span>
        </label>
        <button type="submit" class="auth-primary" id="su-submit" data-signup-action="submit">Créer mon compte</button>
      </div>
    </form>

    <div class="auth-divider" id="auth-or">ou</div>
    <button type="button" class="auth-social" id="auth-google">
      <svg class="auth-google-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continuer avec Google
    </button>

    <p class="auth-switch" id="auth-switch"></p>
  </div>
</div>
